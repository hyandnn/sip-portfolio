name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check repository
        run: make audit
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests without Neural Engine dependency
        run: make test-ci
      - name: Build and verify local app bundle
        run: make release
