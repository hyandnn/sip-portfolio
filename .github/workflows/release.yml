name: macOS preview release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check version matches tag
        run: |
          release_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)
          test "v$release_version" = "$GITHUB_REF_NAME"
      - name: Check repository
        run: make audit
      - name: Run CI tests
        run: make test-ci
      - name: Build universal app and packages
        run: make dist
      - name: Verify archived app in isolated data directory
        run: ./scripts/verify-release.sh
      - name: Upload distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-preview
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  verify-intel:
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Check out verification script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download universal packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macOS-preview
          path: build/dist
      - name: Verify executable and resources on Intel runner
        run: ./scripts/verify-release.sh --resources-only

  publish:
    needs: [package, verify-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download checked packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macOS-preview
          path: dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "Sipfolio $GITHUB_REF_NAME — macOS preview" \
            --notes-file packaging/RELEASE_NOTES.md dist/*
